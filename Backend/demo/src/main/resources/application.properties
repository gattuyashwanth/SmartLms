spring.application.name=smartlms

server.port=8008

spring.datasource.url=jdbc:mysql://localhost:3306/smartlms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=SmartLMSSecretKeyForJWTHashingMustBeAtLeast256BitsLongForHMACSHA256Security12345
jwt.expiration=86400000